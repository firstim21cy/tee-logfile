[tox]
requires =
    tox>=4
envlist = py{310,311,312,313}, plot

[testenv]
description = Run unit tests
deps =
    pytest
allowlist_externals = poetry
commands =
    poetry run pytest -v

[testenv:release]
skip_install = true
allowlist_externals = poetry, bash
description = Bump version and publish package
commands_pre =
    bash -c 'git diff --quiet || { echo "❌ Git working directory is not clean. Commit before release."; exit 1; }'
commands =
    bash -c 'rm -rf dist'
    poetry version patch
    poetry publish --build
    bash -c 'VERSION=$(poetry version -s) && \
             git add pyproject.toml && \
             git commit -m "Release version $VERSION" && \
             git push'
commands_post =
    python -c "print('✅ Package uploaded! at: https://pypi.org/project/tee-logfile')"
